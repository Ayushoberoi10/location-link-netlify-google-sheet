<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Access Check</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6f8;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    p {
      color: #666;
      line-height: 1.5;
      font-size: 14px;
    }

    .status {
      margin-top: 20px;
      font-size: 14px;
      color: #333;
    }

    .notice {
      margin-top: 18px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="box">

    <h2>Access Check</h2>

    <p>
      Please wait while we verify your connection.
    </p>

    <div class="status" id="status">
      Checking connection...
    </div>

    <div class="notice">
      This page records basic connection and browser information
      for access verification.
    </div>

  </div>


  <script>

    async function checkConnection() {

      const status = document.getElementById("status");

      try {

        const response = await fetch(
          "/.netlify/functions/location",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              page: window.location.href,
              referrer: document.referrer || ""
            })
          }
        );

        const result = await response.json();

        if (result.success) {

          status.textContent =
            "Connection verified.";

        } else {

          status.textContent =
            "Connection verification failed.";

          console.error(result);

        }

      } catch (error) {

        status.textContent =
          "Connection verification failed.";

        console.error(error);

      }

    }

    checkConnection();

  </script>

</body>
</html>
